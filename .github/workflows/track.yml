name: Flight Price Tracker

on:
  schedule:
    # Every hour, on the hour (UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: flight-tracker
  cancel-in-progress: false

jobs:
  track-flight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Search live Google Flights prices
        run: node tracker.js

      - name: Commit & push updated flight data
        run: |
          git config user.name "Flight Tracker Bot"
          git config user.email "bot@flighttracker.local"
          git add flight_history.json latest_snapshot.json
          git diff --staged --quiet || (git commit -m "chore(tracker): update flight price snapshot [skip ci]" && git pull --rebase && git push)
